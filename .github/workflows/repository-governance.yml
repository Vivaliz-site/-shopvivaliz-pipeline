name: Repository Governance Gate
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governance contract
        run: bash scripts/repository-governance-validate.sh ci
      - name: Verify audit self-test evidence
        run: |
          test -s artifacts/audit-governance-self-test/report.json
          test -s artifacts/audit-governance-self-test/report.md
          test -s artifacts/global-audit-policy/report.json
          test -s artifacts/global-audit-policy/report.md
      - name: Upload audit governance self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-governance-self-test-${{ github.run_id }}
          path: |
            artifacts/audit-governance-self-test/
            artifacts/global-audit-policy/
          if-no-files-found: error
          retention-days: 90
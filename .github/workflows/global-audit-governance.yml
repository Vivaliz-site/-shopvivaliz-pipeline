name: Global Audit Governance Fleet

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AUDIT_POLICY.md'
      - 'AGENTS.md'
      - 'AGENTS.override.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'REGRAS-AGENTES-CENTRALIZADAS.md'
      - 'docs/quality/**'
      - 'scripts/validate-audit-governance.py'
      - 'scripts/verify-global-audit-governance.py'
      - '.github/workflows/global-audit-governance.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: global-audit-governance
  cancel-in-progress: true

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify global governance parity
        env:
          AUDIT_FLEET_SELF_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_TOKEN"
          python scripts/verify-global-audit-governance.py
      - name: Upload fleet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-audit-governance-${{ github.run_id }}
          path: artifacts/global-audit-governance/
          if-no-files-found: error
          retention-days: 90
